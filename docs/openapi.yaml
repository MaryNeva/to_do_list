openapi: 3.0.3
info:
  title: to-do-list API
  version: "1.0.0"
  description: |
    A small task-management API: JWT authentication, per-user tasks, and
    profile management. See README.md for architecture and setup.
servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: auth
  - name: tasks
  - name: users
  - name: operations
    description: |
      Liveness, readiness and metrics. These sit at the root of the service,
      outside the /api/v1 prefix, and need no authentication.

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Create a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for a JWT access token
      security: []
      description: |
        Answers 401 for an unknown user or a wrong password, and also when the
        password is changed while this login is in flight: the session would
        otherwise be opened behind the revocation that the password change ran.
        The client should retry with the new password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new pair
      security: []
      description: |
        Rotates the session: the presented refresh token is consumed and a
        new one is issued together with a fresh access token. The exchange is
        atomic, so if several requests present the same token only one is
        served; the others are treated as a replay, which revokes every
        session of that user - including the one just handed out.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      security: []
      description: |
        Ends the session the refresh token belongs to. Already unknown or
        revoked tokens are accepted, since the requested state is reached
        either way.

        The access token issued earlier is NOT invalidated: it is stateless
        and stays valid until its own exp, at most jwt.ttl after it was
        issued. The same applies after a password change, which revokes every
        refresh session of the account. Lower jwt.ttl if a deployment needs
        access cut off sooner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/me:
    get:
      tags: [auth]
      summary: Identity carried by the caller's own bearer token
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /tasks:
    post:
      tags: [tasks]
      summary: Create a task owned by the caller
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [tasks]
      summary: List the caller's own tasks
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, description: "Page size; values above the maximum are trimmed to it",
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: status, in: query, schema: { type: string, enum: [created, in_progress, completed] } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, updated_at, title, status], default: created_at } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: One page of the caller's tasks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      summary: Get one of the caller's own tasks
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [tasks]
      summary: Update one of the caller's own tasks
      description: >-
        Only the properties present in the body are written, so a client that
        sends a title cannot erase a description someone else just changed.
        Setting status here is absolute and safe to retry, unlike
        POST /tasks/{id}/toggle-status.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaskRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [tasks]
      summary: Delete one of the caller's own tasks
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /tasks/{id}/toggle-status:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      summary: Cycle status created -> in_progress -> completed -> created
      description: >-
        Relative, so a retry after a lost response advances the task a second
        time. Use PATCH /tasks/{id} with an explicit status when that matters.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /users:
    get:
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      tags: [users]
      summary: List every user (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      summary: Get a user (self, or admin for any user)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [users]
      summary: Update a user (self, or admin for any user)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [users]
      summary: Delete a user (self, or admin for any user)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /healthz:
    servers:
      - url: http://localhost:8080
    get:
      tags: [operations]
      summary: Liveness probe
      description: |
        Answers as long as the process is running. It deliberately touches no
        dependency: restarting the service because the database blinked makes
        an outage longer, not shorter. Use /readyz to decide whether to send
        traffic.
      security: []
      responses:
        '200':
          description: The process is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /readyz:
    servers:
      - url: http://localhost:8080
    get:
      tags: [operations]
      summary: Readiness probe
      description: |
        Probes every dependency, each under health.ready_timeout, and reports
        them separately so an unready instance names the dependency at fault.
        Answers 503 if any check fails.
      security: []
      responses:
        '200':
          description: Every dependency answered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: At least one dependency is unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /metrics:
    servers:
      - url: http://localhost:8080
    get:
      tags: [operations]
      summary: Prometheus metrics
      description: |
        The Prometheus text exposition format. Served only when
        observability.metrics_enabled is true, at observability.metrics_path.
        The endpoint is unauthenticated, so it belongs on an internal network
        or behind an ingress rule. See the Observability section of README.md
        for the metric list.
      security: []
      responses:
        '200':
          description: Metrics in the Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated, but not allowed to perform this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource does not exist (or belongs to another user)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Username or email already taken
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: >-
        The request was well formed but could not be completed in time - a
        dependency was too slow, or the server is shutting down and abandoned
        the work. Nothing was necessarily written or not written; the request
        is safe to retry after the Retry-After delay.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Page:
      type: object
      description: |
        The envelope every list endpoint returns. limit and offset echo what
        was actually applied after clamping, which is not always what was
        asked for: a limit above the configured maximum comes back trimmed to
        it, so a client can page correctly without knowing the server's
        limits in advance.
      required: [items, total, limit, offset]
      properties:
        total:
          type: integer
          format: int32
          minimum: 0
          description: Rows matching the query, ignoring limit and offset.
        limit:
          type: integer
          format: int32
          minimum: 1
          description: Page size actually used.
        offset:
          type: integer
          format: int32
          minimum: 0

    TaskPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Task' }

    UserPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/User' }

    Health:
      type: object
      required: [status, build]
      properties:
        status:
          type: string
          example: ok
        build:
          $ref: '#/components/schemas/BuildInfo'

    BuildInfo:
      type: object
      description: |
        Identity of the running binary. Set through -ldflags at build time,
        falling back to the VCS stamps the Go toolchain embeds.
      required: [version, commit, built_at, go_version]
      properties:
        version:
          type: string
          example: v1.4.0
        commit:
          type: string
          example: 9f2c1ab
        built_at:
          type: string
          example: "2026-09-17T09:12:00Z"
        go_version:
          type: string
          example: go1.24.0

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ReadinessCheck'
      example:
        status: ready
        checks:
          postgres:
            status: ok
            duration_ms: 0.42

    ReadinessCheck:
      type: object
      required: [status, duration_ms]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        duration_ms:
          type: number
          format: double
          minimum: 0
      description: >-
        The reason a check failed is deliberately absent: it names the host,
        port, database and user the probe could not reach, and this endpoint
        needs no credentials. It is written to the service log instead.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            The stable identifier of the failure. Branch on this; the message
            is written for people and may be reworded at any time.
          enum:
            - validation_error
            - bad_request
            - not_found
            - conflict
            - unauthorized
            - invalid_credentials
            - forbidden
            - method_not_allowed
            - payload_too_large
            - rate_limited
            - unavailable
            - internal_error
        message: { type: string }
        request_id: { type: string }
        fields:
          type: array
          description: Which fields were rejected. Sent with validation_error only.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        # Lengths are counted in Unicode characters, not bytes.
        username: { type: string, minLength: 3, maxLength: 50 }
        email: { type: string, format: email }
        # minLength counts characters; maxLength is bcrypt's 72-byte limit.
        password: { type: string, minLength: 8, maxLength: 72 }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    LoginResponse:
      type: object
      # Refresh fields are omitted for the bootstrap admin.
      required: [token, token_type, expires_at]
      properties:
        token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }

    Me:
      type: object
      required: [user_id, username, is_admin]
      properties:
        user_id: { type: integer, format: int64 }
        username: { type: string }
        is_admin: { type: boolean }

    User:
      type: object
      description: Never includes the password hash - see README "Fixed issues".
      required: [id, username, email, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        username: { type: string, minLength: 1 }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UpdateUserRequest:
      type: object
      minProperties: 1
      description: >-
        A partial edit. Every property is optional and only the ones present
        are written; a property sent as null counts as absent. Unlike a
        task's description, no profile field can be cleared: a property that
        is present but empty is rejected with 400, as is a body that carries
        no property at all. Changing the password revokes every refresh
        token of that user.
      properties:
        # Lengths count Unicode characters after trimming; passwords are not trimmed.
        username: { type: string, minLength: 3, maxLength: 50 }
        email: { type: string, format: email, minLength: 3 }
        # minLength counts characters; maxLength is bcrypt's 72-byte limit.
        password: { type: string, minLength: 8, maxLength: 72 }

    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        # Lengths are counted in Unicode characters, not bytes.
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }

    UpdateTaskRequest:
      type: object
      minProperties: 1
      description: >-
        A partial edit. Every property is optional and only the ones present
        are written; a property sent as null counts as absent. An empty
        description clears it, an empty title is rejected.
      properties:
        # Lengths are counted in Unicode characters, not bytes.
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Present and non-empty to rename; absent to keep the current title.
        description:
          type: string
          maxLength: 4000
          description: Present to overwrite, "" to clear, absent to keep.
        status:
          type: string
          enum: [created, in_progress, completed]
          description: >-
            The status the task should end up in. Absolute, not relative, so
            repeating the same request leaves the task where it already is.

    Task:
      type: object
      required: [id, title, description, status, creator_id, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        title: { type: string, minLength: 1 }
        description: { type: string }
        status: { type: string, enum: [created, in_progress, completed] }
        creator_id: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
