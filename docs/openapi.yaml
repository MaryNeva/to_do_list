openapi: 3.0.3
info:
  title: to-do-list API
  version: "1.0.0"
  description: |
    A small task-management API: JWT authentication, per-user tasks, and
    profile management. See README.md for architecture and setup.
servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: auth
  - name: tasks
  - name: users
  - name: operations
    description: |
      Liveness, readiness and metrics. These sit at the root of the service,
      outside the /api/v1 prefix, and need no authentication.

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for a JWT access token
      description: |
        Answers 401 for an unknown user or a wrong password, and also when the
        password is changed while this login is in flight: the session would
        otherwise be opened behind the revocation that the password change ran.
        The client should retry with the new password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new pair
      description: |
        Rotates the session: the presented refresh token is consumed and a
        new one is issued together with a fresh access token. The exchange is
        atomic, so if several requests present the same token only one is
        served; the others are treated as a replay, which revokes every
        session of that user - including the one just handed out.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      description: |
        Ends the session the refresh token belongs to. Already unknown or
        revoked tokens are accepted, since the requested state is reached
        either way.

        The access token issued earlier is NOT invalidated: it is stateless
        and stays valid until its own exp, at most jwt.ttl after it was
        issued. The same applies after a password change, which revokes every
        refresh session of the account. Lower jwt.ttl if a deployment needs
        access cut off sooner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [auth]
      summary: Identity carried by the caller's own bearer token
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tasks:
    post:
      tags: [tasks]
      summary: Create a task owned by the caller
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [tasks]
      summary: List the caller's own tasks
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, description: "Page size; values above the maximum are trimmed to it",
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: status, in: query, schema: { type: string, enum: [created, in_progress, completed] } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, updated_at, title, status], default: created_at } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: One page of the caller's tasks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      summary: Get one of the caller's own tasks
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [tasks]
      summary: Update one of the caller's own tasks
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaskRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [tasks]
      summary: Delete one of the caller's own tasks
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{id}/toggle-status:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      summary: Cycle status created -> in_progress -> completed -> created
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users:
    get:
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      tags: [users]
      summary: List every user (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      summary: Get a user (self, or admin for any user)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [users]
      summary: Update a user (self, or admin for any user)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [users]
      summary: Delete a user (self, or admin for any user)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /healthz:
    servers:
      - url: http://localhost:8080
    get:
      tags: [operations]
      summary: Liveness probe
      description: |
        Answers as long as the process is running. It deliberately touches no
        dependency: restarting the service because the database blinked makes
        an outage longer, not shorter. Use /readyz to decide whether to send
        traffic.
      security: []
      responses:
        '200':
          description: The process is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /readyz:
    servers:
      - url: http://localhost:8080
    get:
      tags: [operations]
      summary: Readiness probe
      description: |
        Probes every dependency, each under health.ready_timeout, and reports
        them separately so an unready instance names the dependency at fault.
        Answers 503 if any check fails.
      security: []
      responses:
        '200':
          description: Every dependency answered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: At least one dependency is unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /metrics:
    servers:
      - url: http://localhost:8080
    get:
      tags: [operations]
      summary: Prometheus metrics
      description: |
        The Prometheus text exposition format. Served only when
        observability.metrics_enabled is true, at observability.metrics_path.
        The endpoint is unauthenticated, so it belongs on an internal network
        or behind an ingress rule. See the Observability section of README.md
        for the metric list.
      security: []
      responses:
        '200':
          description: Metrics in the Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated, but not allowed to perform this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource does not exist (or belongs to another user)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Username or email already taken
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Page:
      type: object
      description: |
        The envelope every list endpoint returns. limit and offset echo what
        was actually applied after clamping, which is not always what was
        asked for: a limit above the configured maximum comes back trimmed to
        it, so a client can page correctly without knowing the server's
        limits in advance.
      required: [items, total, limit, offset]
      properties:
        total:
          type: integer
          format: int32
          minimum: 0
          description: Rows matching the query, ignoring limit and offset.
        limit:
          type: integer
          format: int32
          minimum: 1
          description: Page size actually used.
        offset:
          type: integer
          format: int32
          minimum: 0

    TaskPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Task' }

    UserPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/User' }

    Health:
      type: object
      properties:
        status:
          type: string
          example: ok
        build:
          $ref: '#/components/schemas/BuildInfo'

    BuildInfo:
      type: object
      description: |
        Identity of the running binary. Set through -ldflags at build time,
        falling back to the VCS stamps the Go toolchain embeds.
      properties:
        version:
          type: string
          example: v1.4.0
        commit:
          type: string
          example: 9f2c1ab
        built_at:
          type: string
          example: "2026-09-17T09:12:00Z"
        go_version:
          type: string
          example: go1.24.0

    Readiness:
      type: object
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ReadinessCheck'
      example:
        status: ready
        checks:
          postgres:
            status: ok
            duration_ms: 0.42

    ReadinessCheck:
      type: object
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        duration_ms:
          type: number
          format: double
        error:
          type: string
          description: Present only when the check failed.

    Error:
      type: object
      properties:
        error: { type: string }
        request_id: { type: string }

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        # Lengths are counted in Unicode characters, not bytes.
        username: { type: string, minLength: 3, maxLength: 50 }
        email: { type: string, format: email }
        # minLength is in characters; maxLength is bcrypt's 72-BYTE limit,
        # so a password of multi-byte characters may be rejected sooner.
        password: { type: string, minLength: 8, maxLength: 72 }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    LoginResponse:
      type: object
      properties:
        token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time }
        # Absent for the bootstrap admin, which has no row in users and so
        # cannot own a session; it re-authenticates with its password.
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }

    Me:
      type: object
      properties:
        user_id: { type: integer, format: int64 }
        username: { type: string }
        is_admin: { type: boolean }

    User:
      type: object
      description: Never includes the password hash - see README "Fixed issues".
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        email: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UpdateUserRequest:
      type: object
      description: Every field is optional; omitted fields are left unchanged.
      properties:
        # Lengths are counted in Unicode characters, not bytes.
        username: { type: string, minLength: 3, maxLength: 50 }
        email: { type: string, format: email }
        # minLength is in characters; maxLength is bcrypt's 72-BYTE limit,
        # so a password of multi-byte characters may be rejected sooner.
        password: { type: string, minLength: 8, maxLength: 72 }

    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        # Lengths are counted in Unicode characters, not bytes.
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }

    UpdateTaskRequest:
      type: object
      required: [title]
      properties:
        # Lengths are counted in Unicode characters, not bytes.
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }

    Task:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [created, in_progress, completed] }
        creator_id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
