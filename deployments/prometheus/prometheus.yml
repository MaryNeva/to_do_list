# Scrape config for the Compose stack; targets use service names, not host ports.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: development

scrape_configs:
  - job_name: to-do-list
    metrics_path: /metrics
    static_configs:
      # METRICS_ADDRESS in docker-compose.yml; /metrics is not on the API port.
      - targets: ["app:9101"]
        labels:
          service: to-do-list

  # Self-scrape, to tell a down service from a down scraper.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
