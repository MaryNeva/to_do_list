# Every non-secret setting. Precedence: environment > .env > this file.
# There are no compiled-in defaults: a missing key stops startup.
# Secrets are read only from .env or the environment:
#
#   DB_PASSWORD           Postgres password
#   JWT_SECRET            JWT signing secret (at least jwt.min_secret_length)
#   ADMIN_USERNAME        optional bootstrap admin login (empty = disabled)
#   ADMIN_PASSWORD_HASH   its bcrypt hash: make gen-admin-hash

app:
  name: to-do-list
  env: development

server:
  address: ":8080"
  read_timeout: 10s
  write_timeout: 10s
  # Grace period for in-flight requests after SIGINT/SIGTERM.
  shutdown_timeout: 15s
  # Max request body in bytes; larger bodies get 413 before any handler runs.
  max_body_bytes: 1048576
  # Behind a reverse proxy, list its addresses and set proxy_header to rate
  # limit by the real client address. The header is trusted only from these
  # proxies. Leave both empty when exposed directly.
  trusted_proxies: ""
  proxy_header: ""

db:
  host: localhost
  port: 5432
  name: to_do
  user: postgres
  sslmode: disable
  # Startup ping: how long to wait for Postgres before failing fast.
  connect_timeout: 5s
  # Timeout for each use-case operation (database calls and waiting for bcrypt).
  call_timeout: 5s
  # Extra queries wait for a free connection. Keep max_connections below the
  # server's max_connections; min_connections avoids reconnect bursts.
  max_connections: 10
  min_connections: 2
  # Recycle connections so the pool recovers from database restarts.
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m

jwt:
  ttl: 1h
  refresh_ttl: 720h
  issuer: to-do-list
  # 32 bytes = HMAC-SHA256 output size. A shorter JWT_SECRET stops startup.
  min_secret_length: 32

password:
  # bcrypt cost: higher is slower for attackers and for logins.
  bcrypt_cost: 12
  min_length: 8
  # Concurrent bcrypt operations (cost 12 is ~250 ms of CPU each). Others
  # queue and fail after db.call_timeout. Roughly the number of CPU cores.
  max_concurrent_hashes: 4

user:
  min_username_length: 3
  max_username_length: 50

task:
  max_title_length: 200
  max_description_length: 4000

pagination:
  default_page_size: 20
  max_page_size: 100

cleanup:
  # How often expired refresh tokens are deleted.
  interval: 1h
  # Keep expired tokens this long so a replay is still detected as reuse,
  # not as an unknown token.
  refresh_token_retention: 720h

ratelimit:
  # Per-client limit shared by /auth/register, /auth/login and /auth/refresh.
  auth_max_requests: 20
  auth_window: 1m

cors:
  allow_origins: "*"
  allow_methods: "GET, POST, PATCH, DELETE, OPTIONS"
  allow_headers: "Origin, Content-Type, Accept, Authorization"

health:
  # Budget for each dependency probe behind GET /readyz.
  ready_timeout: 2s

observability:
  # Prometheus endpoint without authentication; do not expose it publicly.
  metrics_enabled: true
  metrics_path: /metrics
  # Metric name prefix, e.g. todo_http_requests_total.
  metrics_namespace: todo
  # Separate listener for /metrics (unpublished in Compose). Empty serves it
  # on the public listener; use that only locally.
  metrics_address: ""

log:
  level: info
  format: json

run_migrations: true
migrations_path: migrations
