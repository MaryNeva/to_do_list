# Local development stack: Postgres and the API. Monitoring is in
# docker-compose.observability.yml (a separate file, because Compose would
# otherwise require GRAFANA_PASSWORD for this stack too).
#
# Ports bind to BIND_HOST (default 127.0.0.1). BIND_HOST=0.0.0.0 exposes them
# to the network; use it only on a trusted network. This file is not a
# production setup: no TLS, and no trusted proxies for the rate limiter.


services:
  db:
    image: postgres:17-alpine
    container_name: todo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-to_do}
    ports:
      # For psql and migrations from the host.
      - "${BIND_HOST:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - todo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-to_do}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: todo_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production

      # Inside the network Postgres is db:5432 regardless of the published
      # port. Name and user must match the db service.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-to_do}
      DB_USER: ${DB_USER:-postgres}

      # Secrets - never in config.yaml.
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Bootstrap admin login; empty disables it.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}

      # Optional overrides; empty keeps the config.yaml value.
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-}

      # Fixed values: prometheus.yml scrapes this path and the Grafana
      # dashboard queries this prefix. deployments/compose_test.go checks both.
      METRICS_PATH: /metrics
      METRICS_NAMESPACE: todo

      # Separate, unpublished listener: /metrics has no authentication and is
      # reachable only from the Compose network.
      METRICS_ADDRESS: ":9101"
    ports:
      # The container port must match server.address in config.yaml.
      - "${BIND_HOST:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  todo_pgdata:
